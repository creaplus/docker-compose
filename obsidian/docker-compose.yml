services:
  obsidian:
    image: linuxserver/obsidian:latest
    container_name: ${CONTAINER_NAME:-obsidian}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      LC_ALL: ${LC_ALL:-zh_CN.UTF-8}
      TITLE: ${TITLE:-Obsidian}
      CUSTOM_USER: ${CUSTOM_USER:-obsidian}
      PASSWORD: ${PASSWORD:-obsidian}
    volumes:
      # linuxserver 的 /config 就是容器家目录（含 Vault），不要再套一层 config/
      - ${DATA_PATH:-$PWD}:/config
    ports:
      - "${PORT:-3005}:3000"
      # - "${HTTPS_PORT:-3006}:3001"
    shm_size: "1gb"
    networks:
      - web_net
    # Electron / 旧内核若无法启动 GUI，可取消下面注释
    # security_opt:
    #   - seccomp:unconfined
    # Intel / AMD GPU 加速可按需取消注释
    # devices:
    #   - /dev/dri:/dev/dri

networks:
  web_net:
    external: true
